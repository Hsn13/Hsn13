name: Update profile cards

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-profile-cards
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out profile
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2
        with:
          card: stats
          options: username=Hsn13&show_icons=true&include_all_commits=true&hide_border=true&bg_color=102c27&title_color=f1d7a5&text_color=e6ede7&icon_color=47c6ae
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: "true"

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2
        with:
          card: top-langs
          options: username=Hsn13&layout=compact&hide_border=true&bg_color=102c27&title_color=f1d7a5&text_color=e6ede7
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: "true"

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg profile/top-langs.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update profile cards"
          git pull --rebase origin main
          git push origin HEAD:main
